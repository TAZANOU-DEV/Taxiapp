name: taxi_app
description: A taxi emergency app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Packages
  socket_io_client: ^3.1.6
  http: ^1.6.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.7
  firebase_core: ^4.11.0
  geolocator: ^14.0.3
  flutter_local_notifications: ^22.0.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  image_picker: ^1.2.2
  shared_preferences: ^2.4.26
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "logo/logo.png"
